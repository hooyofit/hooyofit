name: Send Daily Reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the send-reminders Edge Function
        run: |
          curl -s -X POST "https://qmiutlpdhmuqfymruxal.supabase.co/functions/v1/send-reminders" -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
